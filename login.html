<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MUST Application Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">

    <img class="logo" src="images/must-logo-small.jpg" alt="Mbarara University logo">

    <h1>Applicant Login</h1>
    <p class="subtitle">Log in to continue your application.</p>

    <form action="#" method="post">

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="e.g. applicant@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="check">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn">Log in</button>

    </form>

    <p class="bottom-text">Don't have an account? <a href="register.html">Create one</a></p>

  </div>

</body>
</html>
